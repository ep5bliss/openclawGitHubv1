<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blueprint for Creators</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">
          <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="16" fill="#2563EB"/><polygon points="13,10 24,16 13,22" fill="white"/></svg>
        </div>
        <span class="logo-text">Blueprint</span>
      </div>
      <ul class="nav-links">
        <li><a href="#" class="nav-link active" data-view="dashboard">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Dashboard
        </a></li>
        <li><a href="#" class="nav-link" data-view="vault">
          <svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4"/><path d="M21 12c0 4.97-4.03 9-9 9S3 16.97 3 12 7.03 3 12 3s9 4.03 9 9z"/></svg>
          Idea Vault
        </a></li>
        <li><a href="#" class="nav-link" data-view="categories">
          <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          Categories
        </a></li>
        <li><a href="#" class="nav-link" data-view="calendar">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Calendar
        </a></li>
        <li><a href="#" class="nav-link" data-view="scripts">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Scripts
        </a></li>
        <li><a href="#" class="nav-link" data-view="teleprompter">
          <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          Teleprompter
        </a></li>
      </ul>
      <button class="btn-primary add-idea-btn" id="globalAddBtn">+ New Idea</button>
    </nav>

    <header class="mobile-header">
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
      <div class="logo-inline">
        <div class="logo-icon sm"><svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="16" fill="#2563EB"/><polygon points="13,10 24,16 13,22" fill="white"/></svg></div>
        Blueprint
      </div>
      <button class="btn-primary sm" id="mobileAddBtn">+</button>
    </header>

    <main class="main-content" id="mainContent"></main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" style="display:none">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 id="modalTitle">New Idea</h2>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
